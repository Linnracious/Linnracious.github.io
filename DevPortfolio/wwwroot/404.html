<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <!--
    Single Page Apps for GitHub Pages
    https://github.com/rafrex/spa-github-pages
    GitHub Pages serves this file for any unknown path. We stash the requested
    path into the query string and bounce to index.html, where spa-github-pages.js
    restores it so Blazor's router can handle the deep link.

    pathSegmentsToKeep = 1  ->  PROJECT page served at /<repo>/.
    Set to 0 for a user/org or custom-domain site served at the root.
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
