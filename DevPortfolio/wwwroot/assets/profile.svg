<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a18"/>
      <stop offset="1" stop-color="#150a1f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#00f0ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 80 H400 M0 160 H400 M0 240 H400 M0 320 H400"/>
    <path d="M80 0 V400 M160 0 V400 M240 0 V400 M320 0 V400"/>
  </g>

  <!-- avatar silhouette -->
  <g filter="url(#glow)">
    <circle cx="200" cy="160" r="62" fill="none" stroke="url(#ring)" stroke-width="3"/>
    <circle cx="200" cy="150" r="40" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="2"/>
    <path d="M120 300 q80 -90 160 0" fill="#ff007f" fill-opacity="0.10" stroke="#ff007f" stroke-width="2"/>
  </g>

  <text x="200" y="365" text-anchor="middle" fill="#00f0ff" fill-opacity="0.7"
        font-family="monospace" font-size="16" letter-spacing="4">REPLACE ME</text>
</svg>
