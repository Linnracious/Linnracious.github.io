name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Run the JavaScript-based actions on Node 24 (silences the Node 20 deprecation
# warnings; GitHub's recommended opt-in until newer action majors ship).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevPortfolio
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DevPortfolio/package-lock.json

      - name: Install npm deps
        run: npm ci

      # Tailwind is also wired into the .csproj build, but running it here keeps
      # CI explicit and lets `npm ci` cache do its job.
      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Publish
        run: dotnet publish -c Release -o ../build

      # Rewrite the base href for the project page. index.html ships with "/" so
      # local `dotnet run` works; production lives at /<repo>/. If you rename the
      # repo, change BASE_PATH here and pathSegmentsToKeep in 404.html.
      - name: Set base path for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # A custom domain (CNAME) or a user/org page (<user>.github.io) serves
          # from the ROOT -> base "/". Project pages serve from /<repo>/.
          if [[ -f ../build/wwwroot/CNAME || "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"; KEEP=0
          else
            BASE_PATH="/${REPO_NAME}/"; KEEP=1
          fi
          echo "Repo: ${REPO_NAME} -> base href: ${BASE_PATH}, pathSegmentsToKeep: ${KEEP}"
          # Match ANY existing <base href="..."> (any value/format) so the rewrite
          # never silently no-ops on a formatting difference.
          sed -i -E "s#<base href=\"[^\"]*\"[^>]*>#<base href=\"${BASE_PATH}\" />#" ../build/wwwroot/index.html
          sed -i -E "s#var pathSegmentsToKeep = [0-9]+;#var pathSegmentsToKeep = ${KEEP};#" ../build/wwwroot/404.html
          echo "Result:"
          grep -o '<base href="[^"]*"' ../build/wwwroot/index.html

      # SPA fallback: GitHub Pages needs a 404.html (already in wwwroot) and a
      # .nojekyll so it doesn't strip Blazor's _framework folder.
      - name: Ensure .nojekyll
        run: touch ../build/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
